<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Task System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
  font-family:'Poppins',sans-serif;
  margin:0;padding:0;
  min-height:100vh;
  background:#000;
  color:#fff;
  overflow-x:hidden;
}
@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-15px)}
  100%{transform:translateY(0)}
}
.particle{
  position:absolute;
  width:5px;height:5px;
  background:rgba(255,255,255,0.15);
  border-radius:50%;
  animation:float 4s ease-in-out infinite;
}
.container-mobile{
  max-width:420px;
  margin:auto;
  padding:20px;
  text-align:center;
  position:relative;
  z-index:1;
}
@keyframes fadeSlide{
  0%{opacity:0;transform:translateY(20px)}
  100%{opacity:1;transform:translateY(0)}
}
.title{padding-top:120px;text-align:center;}
.title h1{font-weight:700;margin:0;color:#fff;animation:fadeSlide 1.5s ease forwards;}
.title h1:first-child{font-size:3rem;line-height:1.1;}
.title h1:last-child{font-size:2.4rem;line-height:1.2;margin-bottom:10px;}
.title p{margin-top:15px;font-size:1.1rem;color:#ccc;}
.btn-start{
  margin-top:30px;
  background:#fff;color:#000;
  border:2px solid #fff;
  border-radius:50px;
  padding:12px 0;
  font-weight:600;
  transition:all 0.3s ease;
}
.btn-start:hover{
  background:#000;color:#fff;
  border:2px solid #fff;
  transform:translateY(-2px);
  box-shadow:0 0 10px rgba(255,255,255,0.3);
}
.navbar{background:rgba(0,0,0,0.8)!important;border-bottom:1px solid #333;}
.navbar .container-fluid{max-width:420px;margin:auto;}
.particle:nth-child(1){top:20%;left:10%;animation-duration:6s;}
.particle:nth-child(2){top:70%;left:80%;animation-duration:8s;}
.particle:nth-child(3){top:50%;left:40%;animation-duration:5s;}
.particle:nth-child(4){top:80%;left:20%;animation-duration:7s;}
.particle:nth-child(5){top:30%;left:70%;animation-duration:6.5s;}
</style>
</head>
<body>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

  <div class="container-fluid">

      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav mt-3">
        <li class="nav-item"><a class="nav-link" href="system 1/Task.html">Tasks</a></li>
        <li class="nav-item"><a class="nav-link" href="system 1/Performances.html">Performances</a></li>
        <li class="nav-item"><a class="nav-link" href="system 1/Strategy.html">Strategy</a></li>
        <li class="nav-item"><a class="nav-link" href="system 1/Financial-tracker.html">Financial tracker</a></li>
        <li class="nav-item"><a class="nav-link" href="system 1/skills-tree.html">Skills tree</a></li>
        <li class="nav-item"><a class="nav-link" href="system 1/loginpage.html">Login</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container-mobile">
  <div class="title">
    <h1>Daily Task</h1>
    <h1>System</h1>
    <p>Boost your productivity</p>
    <a href="system 1/system1.html" class="btn btn-start w-100">Start</a>
  </div>
</div>

</html>
