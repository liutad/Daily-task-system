<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Tasks</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<style>
body { background: #111; color: white; padding-top: 50px; }
</style>
</head>

<body>
<div class="container text-center">
    <h2>Add Your Tasks</h2>

    <input id="inputTask" class="form-control mt-3" placeholder="Write a task">
    <button class="btn btn-success mt-3" id="addTaskBtn">Add</button>

    <ul id="taskList" class="list-group mt-3"></ul>

    <button class="btn btn-primary mt-4" id="startBtn"> Ready</button>
</div>

<script>
let tasks = [];

document.getElementById("addTaskBtn").addEventListener("click", () => {
    let t = inputTask.value.trim();
    if (!t) return;

    tasks.push(t);

    let li = document.createElement("li");
    li.textContent = t;
    li.className = "list-group-item";
    taskList.appendChild(li);

    inputTask.value = "";
});

document.getElementById("startBtn").addEventListener("click", () => {
    if (tasks.length === 0) return alert("Add at least 1 task");

    localStorage.setItem("tasks", JSON.stringify(tasks));
    localStorage.setItem("currentTaskIndex", "0");
    localStorage.setItem("day", "1");

    window.location.href = "system1.html";
});
</script>
</body>
</html>
