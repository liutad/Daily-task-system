<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Daily-task-system</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{
  /* Core system colors (brighter cards) */
  --bg:#04050c;
  --card:#151a33;

  /* Text */
  --text:#f6f8ff;        /* near white */
  --muted:#c2c8e4;       /* readable muted */

  /* Solo Leveling accents */
  --accent:#5ee7ff;      /* bright cyan */
  --accent-2:#6f7dff;    /* violet blue */

  /* Status colors */
  --ok:#3cff8f;
  --warn:#ffd84d;
  --danger:#ff4d6d;
}

/* Reset */
*{box-sizing:border-box}

/* Background */
body{
  background:
    radial-gradient(1100px 520px at 50% -180px, rgba(111,125,255,0.22), transparent),
    linear-gradient(180deg,#02030a 0%, var(--bg) 100%);
  color:var(--text);
  font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
  padding:20px;
}

/* Container */
.container{
  max-width:420px;
  margin:6px auto;
}

/* Card / Panel (BRIGHTER & CLEAR) */
.card{
  background:
    linear-gradient(180deg, rgba(255,255,255,0.12), rgba(0,0,0,0.35)),
    var(--card);
  border-radius:18px;
  padding:14px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 0 0 1px rgba(111,125,255,0.22),
    0 16px 45px rgba(0,0,0,0.9);
}

/* Titles */
h2{
  font-weight:800;
  margin-bottom:8px;
  letter-spacing:.6px;
  color:white;
  text-shadow:
    0 0 10px rgba(111,125,255,0.6),
    0 0 24px rgba(94,231,255,0.25);
}

/* Inputs */
.form-control{
  background:#080b1f;
  border:1px solid rgba(255,255,255,0.08);
  color:var(--text);
  border-radius:10px;
  padding:10px;
}

/* Buttons */
.btn-round{border-radius:999px}

.btn-primary{
  background:linear-gradient(90deg,var(--accent-2),var(--accent));
  border:0;
  color:#fff;
  box-shadow:
    0 0 14px rgba(95,108,255,0.55),
    0 10px 28px rgba(0,0,0,0.7);
}

.btn-success{background:var(--ok);border:0}
.btn-danger{background:var(--danger);border:0}
.btn-warning{background:var(--warn);border:0;color:#000}

/* Lists */
.list-group-item{
  background:
    linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.25));
  border:1px solid rgba(255,255,255,0.08);
  padding:10px 12px;
  margin-bottom:8px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* Text */
.task-text{
  flex:1;
  padding-right:8px;
  color:#ffffff;
  font-weight:600;
}

.time-badge{
  font-size:11px;
  color:var(--muted);
  padding:3px 8px;
  border-radius:999px;
  background:rgba(255,255,255,0.08);
}

/* History */
.history-item{
  padding:10px;
  border-radius:12px;
  margin-bottom:10px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.35));
  border:1px solid rgba(255,255,255,0.08);
}

/* Glow utility */
.glow{
  box-shadow:
    0 0 22px rgba(111,125,255,0.45),
    0 0 44px rgba(94,231,255,0.25);
}

/* XP bar (MORE VISIBLE ON PHONE) */
.xp-wrap{
  height:14px;
  background:#070b20;
  border-radius:999px;
  overflow:hidden;
  margin-top:10px;
  border:1px solid rgba(255,255,255,0.08);
}

.xp-bar{
  height:100%;
  width:0%;
  background:
    linear-gradient(90deg,var(--accent-2),var(--accent));
  box-shadow:
    0 0 14px rgba(94,231,255,0.9),
    0 0 28px rgba(111,125,255,0.6);
  transition:width .45s cubic-bezier(.2,.9,.3,1);
}

/* Animations */
.pop{animation:popIn .26s cubic-bezier(.2,.9,.3,1) both}
.tiny{animation:popIn .18s cubic-bezier(.2,.9,.3,1) both}

@keyframes popIn{
  from{transform:translateY(6px) scale(.98);opacity:0}
  to{transform:none;opacity:1}
}

/* Delete animation */
.slide-out-left{
  animation:slideOut .28s ease forwards;
}
@keyframes slideOut{
  to{opacity:0;transform:translateX(-18px) scale(.98)}
}

/* Responsive */
@media (max-width:420px){
  .container{padding:8px}
}
</style>

</head>
<body>


  <!-- create card -->
  <div class="card pop mt-3">
    <h5 style="margin:0 0 8px 0">Add New Task</h5>
    <input id="inputTask" class="form-control" placeholder="Write a task...">
    <div class="d-flex gap-2 mt-3">
      <button id="addTaskBtn" class="btn btn-success btn-round w-50">Add</button>
      <button id="saveBtn" class="btn btn-primary btn-round w-50">Save</button>
    </div>
    <div class="xp-wrap" title="XP (visual only)">
      <div id="xpBar" class="xp-bar"></div>
    </div>
  </div>

  <!-- tasks -->
  <div class="card pop mt-3">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h5 style="margin:0">Today's Tasks</h5>
      <div>
        <button id="reuseAll" class="btn btn-warning btn-sm btn-round">Reuse All</button>
      </div>
    </div>
    <ul id="taskList" class="list-group mt-3"></ul>
  </div>

  <!-- history -->
  <div class="card pop mt-3">
    <h5 style="margin:0 0 8px 0">Tasks History</h5>
    <div id="historyList"></div>
    <div class="mt-3">
      <button id="clearHistory" class="btn btn-danger btn-round w-100">Clear History</button>
    </div>
  </div>
</div>

<script>
/* -----------------------
   Storage keys used:
     - 'tasks'            : array of today's tasks (main system uses this)
     - 'historyDay1'      : array of history entries {text,time}
     - 'currentTaskIndex' : index for main system
     - 'day'               : (kept for compatibility)
   This upgraded script:
     - fixes edit/remove logic (updates tasks[])
     - saves tasks -> localStorage and history
     - supports reuse per-item and reuse-all
     - visual effects (pop, confetti, xp bar, tiny sounds)
   ----------------------- */

const inputTask = document.getElementById('inputTask');
const addTaskBtn = document.getElementById('addTaskBtn');
const saveBtn = document.getElementById('saveBtn');
const reuseAll = document.getElementById('reuseAll');
const clearHistory = document.getElementById('clearHistory');
const taskList = document.getElementById('taskList');
const historyList = document.getElementById('historyList');
const xpBar = document.getElementById('xpBar');

let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
let history = JSON.parse(localStorage.getItem('historyDay1') || '[]');
let xp = Number(localStorage.getItem('xp') || '0'); // purely visual

// clamp helper
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// small audio tone helper (optional)
function tone(freq=660, dur=0.06, vol=0.08) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    setTimeout(()=>{ o.stop(); ctx.close(); }, dur*1000 + 20);
  } catch(e) { /* audio blocked */ }
}

// confetti (small)
function burstConfetti(parent, count=14) {
  for (let i=0;i<count;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (50 + (Math.random()*80 - 40)) + '%';
    c.style.top = (10 + Math.random()*8) + '%';
    c.style.background = ['#FFB86C','#7C5CFF','#FF6B6B','#FFD166'][Math.floor(Math.random()*4)];
    parent.appendChild(c);
    c.animate([
      { transform: `translateY(0) rotate(0deg)`, opacity:1 },
      { transform: `translateY(${80 + Math.random()*120}px) rotate(${200 + Math.random()*360}deg)`, opacity:0 }
    ], { duration: 700 + Math.random()*500, easing:'cubic-bezier(.2,.9,.3,1)'});
    setTimeout(()=>c.remove(), 1400);
  }
}

// render tasks (keeps tasks[] authoritative)
function renderTasks() {
  taskList.innerHTML = '';
  tasks.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = 'list-group-item pop';
    li.innerHTML = `
      <div class="task-text">${escapeHtml(t)}</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-sm btn-warning" onclick="editTask(${i})">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="removeTask(${i})">✕</button>
      </div>
    `;
    taskList.appendChild(li);
  });
}

// render history
function renderHistory() {
  historyList.innerHTML = '';
  history.forEach((h, idx) => {
    const d = document.createElement('div');
    d.className = 'history-item pop';
    d.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <strong>${escapeHtml(h.text)}</strong><br>
          <small class="time-badge">${h.time}</small>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm btn-success" onclick="reuseHistory(${idx})">Reuse</button>
          <button class="btn btn-sm btn-danger" onclick="deleteHistory(${idx})">✕</button>
        </div>
      </div>
    `;
    historyList.appendChild(d);
  });
}

// safe escape
function escapeHtml(s){ return (s+'').replace(/[&<>"']/g, (m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// xp visual
function updateXpBar(){ xpBar.style.width = xp + '%'; }
function bumpXp(amount=6){
  xp = clamp(xp + amount, 0, 100);
  localStorage.setItem('xp', xp);
  xpBar.style.width = xp + '%';
  xpBar.animate([{ transform:'scaleX(.98)' }, { transform:'scaleX(1)' }], { duration:700, easing:'ease' });
}

// initial render
renderTasks();
renderHistory();
updateXpBar();

// add task (updates tasks[])
addTaskBtn.addEventListener('click', ()=>{
  const text = inputTask.value.trim();
  if(!text){
    // shake input to show error
    inputTask.animate([{ transform:'translateX(0)' }, { transform:'translateX(-6px)' }, { transform:'translateX(6px)' }, { transform:'translateX(0)' }], { duration:260 });
    tone(240,0.06,0.06);
    return;
  }
  tasks.push(text);
  inputTask.value = '';
  renderTasks();
  // micro effect
  pulse(addTaskBtn);
  tone(720,0.04,0.06);
});

// editTask updates tasks[]
window.editTask = function(i){
  const newText = prompt('Edit task:', tasks[i]);
  if (newText === null) return;
  tasks[i] = newText;
  renderTasks();
  pulse(document.querySelectorAll('#taskList .list-group-item')[i]);
  tone(520,0.05,0.06);
};

// removeTask updates tasks[]
window.removeTask = function(i){
  const items = document.querySelectorAll('#taskList .list-group-item');
  const el = items[i];
  if(el){
    el.classList.add('slide-out-left');
    setTimeout(()=>{ tasks.splice(i,1); renderTasks(); }, 260);
  } else {
    tasks.splice(i,1);
    renderTasks();
  }
  tone(320,0.04,0.05);
};

// Save: persist tasks -> localStorage and add to historyDay1
saveBtn.addEventListener('click', ()=>{
  if(tasks.length === 0){
    alert('Add at least one task');
    return;
  }

  // Persist main tasks for main body system
  localStorage.setItem('tasks', JSON.stringify(tasks));
  localStorage.setItem('currentTaskIndex', '0');
  localStorage.setItem('day', '1'); // kept for compatibility

  // Push tasks to historyDay1
  const saved = JSON.parse(localStorage.getItem('historyDay1') || '[]');
  tasks.forEach(t => saved.push({ text: t, time: new Date().toLocaleTimeString() }));
  localStorage.setItem('historyDay1', JSON.stringify(saved));
  history = saved;

  // Reset today's tasks in memory and UI (so Save acts like "commit")
  tasks = [];
  renderTasks();
  renderHistory();

  // visual effects
  burstConfetti(document.body, 22);
  bumpXp(10);
  tone(880,0.09,0.09);
  flashSave();
  alert('Tasks saved successfully!');
});

// Reuse a single history item
window.reuseHistory = function(index){
  const item = history[index];
  if(!item) return;
  tasks.push(item.text);
  localStorage.setItem('tasks', JSON.stringify(tasks));
  renderTasks();
  bumpXp(3);
  tone(660,0.06,0.08);
};

// Delete history entry (updates historyDay1)
window.deleteHistory = function(i){
  history.splice(i,1);
  localStorage.setItem('historyDay1', JSON.stringify(history));
  renderHistory();
  tone(300,0.04,0.05);
};

// Reuse All: replace today's tasks with all history texts (Option C behavior)
reuseAll.addEventListener('click', ()=>{
  if(history.length === 0){ alert('No history to reuse'); return; }
  tasks = history.map(h => h.text);
  localStorage.setItem('tasks', JSON.stringify(tasks));
  renderTasks();
  burstConfetti(document.body, 26);
  bumpXp(12);
  tone(960,0.08,0.09);
  alert('All history tasks loaded into Today\'s Tasks');
});

// Clear all history
clearHistory.addEventListener('click', ()=>{
  if(!confirm('Clear all history?')) return;
  history = [];
  localStorage.removeItem('historyDay1');
  renderHistory();
  tone(220,0.04,0.05);
});

// small pulsing effect helper
function pulse(el){
  try{
    el.animate([{ transform:'scale(1)' }, { transform:'scale(1.04)' }, { transform:'scale(1)' }], { duration:260, easing:'cubic-bezier(.2,.9,.3,1)'});
  }catch(e){}
}

// save flash on header
function flashSave(){
  const card = document.querySelector('.card.pop.glow');
  if(!card) return;
  card.animate([{ boxShadow:'0 8px 36px rgba(124,92,255,0.18)' }, { boxShadow:'0 6px 30px rgba(0,0,0,0.6)' }], { duration:700, easing:'cubic-bezier(.2,.9,.3,1)'});
}

// small welcome confetti if some history exists and xp empty
if(history.length > 0 && xp === 0){
  burstConfetti(document.body, 10);
  xp = clamp(xp + 6, 0, 100);
  localStorage.setItem('xp', xp);
}
updateXpBar();

function updateXpBar(){ xpBar.style.width = xp + '%'; }

</script>
</body>
</html>
