<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Tasks</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<style>
body { 
    background: #000; 
    color: white; 
}

.container-mobile {
    max-width: 420px;
    margin: auto;
    padding: 20px;
}

/* Fade screens */
#welcome {
    text-align: center;
    margin-top: 150px;
    font-size: 2rem;
    opacity: 1;
    transition: 1s;
}

#content {
    opacity: 0;
    transition: 1s;
    text-align: center;
    margin-top: 150px;
}
</style>
</head>

<body>

<div class="container-mobile">

    <div id="welcome">Start your journey today!</div>

    <div id="content">
        <h1 id="dayTitle"></h1>
        <h2 id="taskText" class="mt-3"></h2>
        <button id="done" class="btn btn-light mt-4 w-100">Done</button>
    </div>

</div>


<script>
// Fade animation
setTimeout(() => {
    welcome.style.opacity = "0";
    setTimeout(() => {
        welcome.style.display = "none";
        content.style.opacity = "1";
    }, 800);
}, 800);

// Get saved data
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let index = Number(localStorage.getItem("currentTaskIndex")) || 0;
let day = Number(localStorage.getItem("day")) || 1;

// Load stats
let stats = JSON.parse(localStorage.getItem("stats")) || {
    strength: 20,
    stamina: 40,
    agility: 35,
    fatigue: 10
};

// Fatigue recovery (offline recovery)
let lastTime = Number(localStorage.getItem("lastUpdateTime")) || Date.now();
let now = Date.now();
let hoursPassed = (now - lastTime) / (1000 * 60 * 60);
stats.fatigue = Math.max(0, stats.fatigue - hoursPassed * 4);
localStorage.setItem("lastUpdateTime", now);


// -------------------
// TASK TYPE DETECTION
// -------------------
function getTaskType(task) {
    task = task.toLowerCase();
    if (task.includes("run") || task.includes("gym") || task.includes("push") || task.includes("lift")) return "physical";
    if (task.includes("clean") || task.includes("walk") || task.includes("move")) return "agility";
    return "mental";
}


// -------------------
// FATIGUE MULTIPLIER
// -------------------
function getFatigueMultiplier() {
    let f = stats.fatigue;

    if (f < 30) return 1.0;
    if (f < 60) return 0.7;
    if (f < 85) return 0.4;
    return 0.15;
}


// -------------------
// STAT INCREASE
// -------------------
function increaseStats(task) {
    const type = getTaskType(task);
    const m = getFatigueMultiplier();

    if (type === "physical") {
        stats.strength += 1.5 * m;
        stats.stamina += 0.7 * m;
        stats.fatigue += 10;
    } 
    else if (type === "agility") {
        stats.agility += 1.2 * m;
        stats.stamina += 0.5 * m;
        stats.fatigue += 8;
    }
    else {
        stats.stamina += 0.3 * m;
        stats.fatigue += 5;
    }

    stats.strength = Math.min(100, stats.strength);
    stats.stamina = Math.min(100, stats.stamina);
    stats.agility = Math.min(100, stats.agility);
    stats.fatigue = Math.min(100, stats.fatigue);

    localStorage.setItem("stats", JSON.stringify(stats));
}


// -------------------
// UPDATE UI
// -------------------
function update() {
    dayTitle.innerText = "Day " + day;

    if (tasks.length === 0) {
        taskText.innerHTML = "No tasks found.<br>Add tasks first.";
        done.style.display = "none";
        return;
    }

    if (index < tasks.length) {
        taskText.innerText = tasks[index];
    }
}

update();


// -------------------
// COMPLETE TASK
// -------------------
done.addEventListener("click", () => {

    // 📌 Increase stats FIRST
    increaseStats(tasks[index]);

    index++;

    // Continue tasks
    if (index < tasks.length) {
        localStorage.setItem("currentTaskIndex", index);
        update();
        return;
    }

    // Finish day
    taskText.innerText = "🎉 Day " + day + " Completed!";
    done.style.display = "none";

    // Save stats
    localStorage.setItem("stats", JSON.stringify(stats));

    setTimeout(() => {
        day++;
        index = 0;
        localStorage.setItem("day", day);
        localStorage.setItem("currentTaskIndex", 0);

        taskText.innerText = "New day unlocked!";
        done.style.display = "block";
    }, 1500);

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
