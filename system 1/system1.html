<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Tasks</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<style>
body { 
    background: #000; 
    color: white; 
}

.container-mobile {
    max-width: 420px;
    margin: auto;
    padding: 20px;
}

/* Fade screens */
#welcome {
    text-align: center;
    margin-top: 150px;
    font-size: 2rem;
    opacity: 1;
    transition: 1s;
}

#content {
    opacity: 0;
    transition: 1s;
    text-align: center;
    margin-top: 150px;
}
</style>
</head>

<body>

<div class="container-mobile">

    <div id="welcome">Start your journey today!</div>

    <div id="content">
        <h1 id="dayTitle"></h1>
        <h2 id="taskText" class="mt-3"></h2>
        <button id="done" class="btn btn-light mt-4 w-100">Done</button>
    </div>

</div>

<script>
// Fade animation
setTimeout(() => {
    welcome.style.opacity = "0";
    setTimeout(() => {
        welcome.style.display = "none";
        content.style.opacity = "1";
    }, 800);
}, 800);

// Get saved data
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let index = Number(localStorage.getItem("currentTaskIndex")) || 0;
let day = Number(localStorage.getItem("day")) || 1;

// Update UI
function update() {
    dayTitle.innerText = "Day " + day;

    if (tasks.length === 0) {
        taskText.innerHTML = "No tasks found.<br>Add tasks first.";
        done.style.display = "none";
        return;
    }

    if (index < tasks.length) {
        taskText.innerText = tasks[index];
    }
}

update();

done.addEventListener("click", () => {
    index++;

    // If tasks left today → continue
    if (index < tasks.length) {
        localStorage.setItem("currentTaskIndex", index);
        update();
        return;
    }

    // If finished all tasks → move to next day
    taskText.innerText = "🎉 Day " + day + " Completed!";
    done.style.display = "none";

    setTimeout(() => {
        day++;
        index = 0;
        localStorage.setItem("day", day);
        localStorage.setItem("currentTaskIndex", 0);

        taskText.innerText = "New day unlocked!";
        done.style.display = "block";
    }, 1500);

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
