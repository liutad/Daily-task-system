<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Tasks</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<style>
body { 
    background: #000; 
    color: white; 
}
#welcome {
    text-align: center;
    margin-top: 120px;
    font-size: 2rem;
    opacity: 1;
    transition: 1s;
}
#content {
    opacity: 0;
    transition: 1s;
    text-align: center;
    margin-top: 140px;
}
</style>
</head>

<body>

<div id="welcome">Start you journey today!</div>

<div id="content">
    <h1 id="dayTitle"></h1>
    <h2 id="taskText"></h2>
    <button id="done" class="btn btn-light mt-4">Done</button>
</div>

<script>
// Fade animation
setTimeout(() => {
    welcome.style.opacity = "0";
    setTimeout(() => {
        welcome.style.display = "none";
        content.style.opacity = "1";
    }, 800);
}, 800);

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let index = Number(localStorage.getItem("currentTaskIndex")) || 0;
let day = Number(localStorage.getItem("day")) || 1;

function update() {
    dayTitle.innerText = "Day " + day;

    if (tasks.length === 0) {
        taskText.innerHTML = "No tasks found.<br>Add tasks first.";
        done.style.display = "none";
        return;
    }

    taskText.innerText = tasks[index];
}

update();

// When user completes
done.addEventListener("click", () => {
    index++;

    if (index < tasks.length) {
        localStorage.setItem("currentTaskIndex", index);
        update();
    } else {
        taskText.innerText = "🎉 Day " + day + " completed!";
        done.style.display = "none";

        // prepare next day
        day++;
        localStorage.setItem("day", day);
        localStorage.removeItem("tasks");
        localStorage.removeItem("currentTaskIndex");

        setTimeout(() => {
            window.location.href = "index.html";
        }, 2000);
    }
});
</script>

</body>
</html>
