<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performances</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<style>
body {
    background: black;
    color: white;
}
.container-mobile {
    max-width: 420px;
    margin: auto;
}
.status-card {
    background: #1a1a1a;
    border-radius: 14px;
}
.progress {
    height: 10px;
    background: #333;
}
.progress-bar {
    background: #4caf50;
    width: 0%;
    transition: width 0.8s ease;
}
</style>
</head>

<body>

<div class="container-mobile mt-4">

  <h1 class="text-center mb-4">Your Status</h1>

  <!-- Strength -->
  <div class="status-card p-3 mb-3">
      <div class="d-flex justify-content-between">
          <strong>Strength</strong>
          <span id="strengthValue">0</span>
      </div>
      <div class="progress mt-1">
          <div id="strengthBar" class="progress-bar"></div>
      </div>
  </div>

  <!-- Stamina -->
  <div class="status-card p-3 mb-3">
      <div class="d-flex justify-content-between">
          <strong>Stamina</strong>
          <span id="staminaValue">0</span>
      </div>
      <div class="progress mt-1">
          <div id="staminaBar" class="progress-bar"></div>
      </div>
  </div>

  <!-- Agility -->
  <div class="status-card p-3 mb-3">
      <div class="d-flex justify-content-between">
          <strong>Agility</strong>
          <span id="agilityValue">0</span>
      </div>
      <div class="progress mt-1">
          <div id="agilityBar" class="progress-bar"></div>
      </div>
  </div>

  <!-- Fatigue -->
  <div class="status-card p-3 mb-3">
      <div class="d-flex justify-content-between">
          <strong>Fatigue</strong>
          <span id="fatigueValue">0%</span>
      </div>
      <div class="progress mt-1">
          <div id="fatigueBar" class="progress-bar bg-danger"></div>
      </div>
  </div>

</div>

<script>
// Load stats
let stats = JSON.parse(localStorage.getItem("stats")) || {
    strength: 40,
    stamina: 70,
    agility: 55,
    fatigue: 20 // NEW SYSTEM
};

// Save stats
localStorage.setItem("stats", JSON.stringify(stats));

/* -----------------------
   FATIGUE EFFECT SYSTEM
--------------------------*/
function applyFatigueEffects(base) {
    let f = stats.fatigue;

    if (f > 70) return Math.round(base * 0.8); // –20%
    if (f > 40) return Math.round(base * 0.9); // –10%
    return base; // Normal
}

/* -----------------------
   UPDATE DISPLAY
--------------------------*/
function updateUI() {
    // Apply fatigue modifiers
    let str = applyFatigueEffects(stats.strength);
    let sta = applyFatigueEffects(stats.stamina);
    let agi = applyFatigueEffects(stats.agility);

    strengthValue.innerText = str + "%";
    staminaValue.innerText = sta + "%";
    agilityValue.innerText = agi + "%";

    strengthBar.style.width = str + "%";
    staminaBar.style.width = sta + "%";
    agilityBar.style.width = agi + "%";

    // Fatigue display
    fatigueValue.innerText = stats.fatigue + "%";
    fatigueBar.style.width = stats.fatigue + "%";

    // Save
    localStorage.setItem("stats", JSON.stringify(stats));
}

updateUI();

/* -----------------------
   AUTO FATIGUE RECOVERY
--------------------------*/
setInterval(() => {
    if (stats.fatigue > 0) {
        stats.fatigue -= 1;
        updateUI();
    }
}, 60000); // Every 1 minute

</script>

</body>
</html>
