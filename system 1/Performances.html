<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performances</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">



<style>
body {
    background: black;
    color: white;
}

</style>
</head>

<body>

<!-- status page -->
<div class="container-mobile mt-4">

  <h1 class="text-center mb-4">Your Status</h1>

  <div class="status-card p-3 mb-3">
      <div class="d-flex justify-content-between">
          <strong>Strength</strong>
          <span id="strengthValue">0</span>
      </div>
      <div class="progress mt-1">
          <div id="strengthBar" class="progress-bar" role="progressbar"></div>
      </div>
  </div>

  <div class="status-card p-3 mb-3">
      <div class="d-flex justify-content-between">
          <strong>Stamina</strong>
          <span id="staminaValue">0</span>
      </div>
      <div class="progress mt-1">
          <div id="staminaBar" class="progress-bar" role="progressbar"></div>
      </div>
  </div>

  <div class="status-card p-3 mb-3">
      <div class="d-flex justify-content-between">
          <strong>Agility</strong>
          <span id="agilityValue">0</span>
      </div>
      <div class="progress mt-1">
          <div id="agilityBar" class="progress-bar" role="progressbar"></div>
      </div>
  </div>

</div>

<style>
.container-mobile {
    max-width: 420px;
    margin: auto;
}
.status-card {
    background: #1a1a1a;
    border-radius: 14px;
}
.progress {
    height: 10px;
    background: #333;
}
.progress-bar {
    background: #4caf50;
    width: 0%;
    transition: width 0.8s ease;
}
</style>

<script>
// default stats if none exist yet
let stats = JSON.parse(localStorage.getItem("stats")) || {
    strength: 40,
    stamina: 70,
    agility: 55
};

// save stats back
localStorage.setItem("stats", JSON.stringify(stats));

// Update UI
function updateStatus() {
    strengthValue.innerText = stats.strength + "%";
    staminaValue.innerText = stats.stamina + "%";
    agilityValue.innerText = stats.agility + "%";

    strengthBar.style.width = stats.strength + "%";
    staminaBar.style.width = stats.stamina + "%";
    agilityBar.style.width = stats.agility + "%";
}

updateStatus();
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
