<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performances</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<style>
body {
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
}

/* Mobile layout */
.container-mobile {
    max-width: 420px;
    margin: auto;
}

/* Anime hologram card */
.status-card {
    background: rgba(20, 20, 20, 0.7);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(0, 255, 255, 0.25);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 0 12px rgba(0,255,255,0.15);
    position: relative;
    overflow: hidden;
    transform: translateY(0);
    animation: float 4s ease-in-out infinite;
}

/* Light glow edges */
.status-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    background: linear-gradient(135deg,
        rgba(0,255,255,0.1),
        rgba(100,100,255,0.15),
        rgba(0,255,255,0.1)
    );
    -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}

/* Floating anime UI effect */
@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
    100% { transform: translateY(0); }
}

/* Anime-style stat label text */
.status-card strong {
    font-size: 1.1rem;
    letter-spacing: 0.5px;
}

/* Futuristic progress bar */
.progress {
    height: 12px;
    background: #111;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
}

.progress-bar {
    background: linear-gradient(90deg, #00eaff, #0077ff);
    height: 100%;
    width: 0%;
    border-radius: 10px;
    box-shadow: 0 0 10px #00eaff;
    transition: width 0.6s ease-out;
}

/* Danger for fatigue */
.progress-bar.bg-danger {
    background: linear-gradient(90deg, #ff0033, #ff7700);
    box-shadow: 0 0 10px #ff0033;
}

/* Title */
h1 {
    text-align: center;
    margin-top: 25px;
    font-size: 2.2rem;
    letter-spacing: 1px;
    font-weight: 700;
}

.progress-bar {
    animation: glowPulse 2s infinite ease-in-out;
}

@keyframes glowPulse {
    0% { box-shadow: 0 0 6px currentColor; }
    50% { box-shadow: 0 0 14px currentColor; }
    100% { box-shadow: 0 0 6px currentColor; }
}

</style>
</head>

<body>

<div class="container-mobile mt-4">

  <h1 class="text-center mb-4">Your Status</h1>

  <!-- Strength -->
  <div class="status-card p-3 mb-3">
      <div class="d-flex justify-content-between">
          <strong>Strength</strong>
          <span id="strengthValue">0</span>
      </div>
      <div class="progress mt-1">
          <div id="strengthBar" class="progress-bar"></div>
      </div>
  </div>

  <!-- Stamina -->
  <div class="status-card p-3 mb-3">
      <div class="d-flex justify-content-between">
          <strong>Stamina</strong>
          <span id="staminaValue">0</span>
      </div>
      <div class="progress mt-1">
          <div id="staminaBar" class="progress-bar"></div>
      </div>
  </div>

  <!-- Agility -->
  <div class="status-card p-3 mb-3">
      <div class="d-flex justify-content-between">
          <strong>Agility</strong>
          <span id="agilityValue">0</span>
      </div>
      <div class="progress mt-1">
          <div id="agilityBar" class="progress-bar"></div>
      </div>
  </div>

  <!-- Fatigue -->
  <div class="status-card p-3 mb-3">
      <div class="d-flex justify-content-between">
          <strong>Fatigue</strong>
          <span id="fatigueValue">0%</span>
      </div>
      <div class="progress mt-1">
          <div id="fatigueBar" class="progress-bar bg-danger"></div>
      </div>
  </div>

  <!-- Radar Chart Section -->
  <div class="status-card p-3 mb-4 text-center">
      <strong class="d-block mb-2">Potential Overview</strong>
      <canvas id="potentialChart" height="260"></canvas>
  </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// Load stats from storage
let stats = JSON.parse(localStorage.getItem("stats")) || {
    strength: 40,
    stamina: 70,
    agility: 55,
    fatigue: 20,
    hp: 80,
    speed: 65
};

// Save stats
localStorage.setItem("stats", JSON.stringify(stats));

/* -----------------------
   POTENTIAL (fixed values)
--------------------------*/
let potential = {
    strength: 90,
    stamina: 85,
    agility: 88,
    speed: 92,
    hp: 95
};

/* -----------------------
   FATIGUE EFFECT SYSTEM
--------------------------*/
function applyFatigueEffects(base) {
    let f = stats.fatigue;

    if (f > 70) return Math.round(base * 0.8); // –20%
    if (f > 40) return Math.round(base * 0.9); // –10%
    return base; // Normal
}

/* -----------------------
   CURRENT VALUES (for radar)
--------------------------*/
function getCurrentStats() {
    return {
        strength: applyFatigueEffects(stats.strength),
        stamina: applyFatigueEffects(stats.stamina),
        agility: applyFatigueEffects(stats.agility),
        speed: applyFatigueEffects(stats.speed),
        hp: stats.hp
    };
}

/* -----------------------
   INIT RADAR CHART
--------------------------*/
const radarCanvas = document.getElementById("potentialChart");
let current = getCurrentStats();

const potentialChart = new Chart(radarCanvas, {
    type: "radar",
    data: {
        labels: ["Strength", "Stamina", "Agility", "Speed", "HP"],
        datasets: [
            {
                label: "Current",
                data: [
                    current.strength,
                    current.stamina,
                    current.agility,
                    current.speed,
                    current.hp
                ],
                borderColor: "#4caf50",
                backgroundColor: "rgba(76, 175, 80, 0.25)",
                borderWidth: 2,
                pointRadius: 3
            },
            {
                label: "Potential",
                data: [
                    potential.strength,
                    potential.stamina,
                    potential.agility,
                    potential.speed,
                    potential.hp
                ],
                borderColor: "#00bcd4",
                backgroundColor: "rgba(0, 188, 212, 0.18)",
                borderWidth: 2,
                pointRadius: 3
            }
        ]
    },
    options: {
        scales: {
            r: {
                beginAtZero: true,
                max: 100,
                grid: { color: "#333" },
                pointLabels: { color: "white" },
                angleLines: { color: "#444" }
            }
        },
        plugins: {
            legend: { labels: { color: "white" } }
        }
    }
});

/* -----------------------
   UPDATE DISPLAY
--------------------------*/
function updateRadar() {
    let cur = getCurrentStats();

    potentialChart.data.datasets[0].data = [
        cur.strength, cur.stamina, cur.agility, cur.speed, cur.hp
    ];

    potentialChart.update();
}

function updateUI() {
    // Apply fatigue modifiers
    let str = applyFatigueEffects(stats.strength);
    let sta = applyFatigueEffects(stats.stamina);
    let agi = applyFatigueEffects(stats.agility);

    strengthValue.innerText = str + "%";
    staminaValue.innerText = sta + "%";
    agilityValue.innerText = agi + "%";

    strengthBar.style.width = str + "%";
    staminaBar.style.width = sta + "%";
    agilityBar.style.width = agi + "%";

    // Fatigue display
    fatigueValue.innerText = stats.fatigue + "%";
    fatigueBar.style.width = stats.fatigue + "%";

    // Update radar chart
    updateRadar();

    localStorage.setItem("stats", JSON.stringify(stats));
}

updateUI();

/* -----------------------
   AUTO FATIGUE RECOVERY
--------------------------*/
setInterval(() => {
    if (stats.fatigue > 0) {
        stats.fatigue -= 1;
        updateUI();
    }
}, 60000); // Every 1 minute

</script>

</body>
</html>
