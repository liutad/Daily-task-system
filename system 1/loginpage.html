<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register & Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
  background: #0b0b0f;
  color: white;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
}
.card-box {
  width: 380px;
  background: #11131a;
  border-radius: 16px;
  padding: 30px;
  box-shadow: 0 0 25px rgba(0,0,0,0.6);
  color: white;
}
h2, label { color: white; }
.btn-main {
  width: 100%; background: #5a4fff; border:none; padding:10px; border-radius:8px; margin-top:10px;
  color: white;
}
.btn-main:hover { background:#7368ff; }
input { background:#0d0f14!important; border:1px solid #2a2d36!important; color:white!important; }
.link-btn { color:#8ea0ff; cursor:pointer; text-decoration:underline; text-align:center; margin-top:12px; }
.hidden{ display:none; }
</style>
</head>
<body>
  <div class="card-box">

    <!-- REGISTER -->
    <div id="registerBox">
      <h2>Register</h2>
      <form id="registerForm">
        <div class="mb-2"><label>Name</label><input id="r_name" class="form-control" required></div>
        <div class="mb-2"><label>Age</label><input id="r_age" type="number" class="form-control" required></div>
        <div class="mb-2"><label>Height (cm)</label><input id="r_height" type="number" class="form-control" required></div>
        <div class="mb-2"><label>Weight (kg)</label><input id="r_weight" type="number" class="form-control" required></div>
        <div class="mb-2"><label>Username</label><input id="r_username" class="form-control" required></div>
        <div class="mb-2"><label>Password</label><input id="r_password" type="password" class="form-control" required></div>
        <button class="btn-main" type="submit">Create Account</button>
      </form>
      <div class="link-btn" onclick="showLogin()">Already have an account? Login</div>
    </div>

    <!-- LOGIN -->
    <div id="loginBox" class="hidden">
      <h2>Login</h2>
      <form id="loginForm">
        <div class="mb-2"><label>Username</label><input id="l_username" class="form-control" required></div>
        <div class="mb-2"><label>Password</label><input id="l_password" type="password" class="form-control" required></div>
        <button class="btn-main" type="submit">Login</button>
      </form>
      <div class="link-btn" onclick="showRegister()">No account? Register</div>
    </div>

  </div>

<script>
function showLogin(){
  document.getElementById('registerBox').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
}
function showRegister(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('registerBox').classList.remove('hidden');
}

// SAVE ACCOUNT
const accounts = JSON.parse(localStorage.getItem('accounts') || '{}');

document.getElementById('registerForm').addEventListener('submit', e => {
  e.preventDefault();

  const data = {
    name: r_name.value.trim(),
    age: r_age.value,
    height: r_height.value,
    weight: r_weight.value,
    username: r_username.value.trim(),
    password: r_password.value
  };

  if(accounts[data.username]){
    alert('Username already exists');
    return;
  }

  accounts[data.username] = data;
  localStorage.setItem('accounts', JSON.stringify(accounts));

  alert('Account created! You can now login.');
  showLogin();
});

// LOGIN

document.getElementById('loginForm').addEventListener('submit', e => {
  e.preventDefault();

  const u = l_username.value.trim();
  const p = l_password.value;

  if(!accounts[u] || accounts[u].password !== p){
    alert('Invalid username or password');
    return;
  }

  // Save the profile for performance page
  localStorage.setItem('profile', JSON.stringify(accounts[u]));

  window.location.href = 'performance.html';
});
</script>

</body>
</html>
