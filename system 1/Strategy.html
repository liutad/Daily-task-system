<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Strategy — Quest System (Solo-Leveling Style)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
  --bg1:#000011;
  --bg2:#000016;
  --glow:#0af;
  --muted: rgba(255,255,255,0.12);
  --accent: #00bfff;
}

/* App background & layout */
html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#eaf6ff;font-family:Inter,Segoe UI,system-ui,Arial;}
.container{max-width:980px;margin:18px auto;padding:16px;}
.app-header{display:flex;align-items:center;gap:14px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;}
.brand{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.logo{
  width:56px;height:56px;border-radius:12px;
  background:linear-gradient(135deg,#022 20%, #013 60%);
  box-shadow:0 6px 22px rgba(0,170,255,0.08), inset 0 0 30px rgba(0,170,255,0.06);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--glow);
  border:1px solid rgba(0,170,255,0.12);
  text-shadow:0 0 8px rgba(10,170,255,0.25);
}

/* XP / Level */
.status {
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.level-badge{
  width:72px;height:72px;border-radius:14px;background:linear-gradient(180deg,#001022,#001834);
  display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(10,140,255,0.35);
  box-shadow:0 0 20px rgba(10,150,255,0.08);font-weight:700;
}
.xp-wrap{min-width:320px; flex:1;}
.xp-bar{
  height:16px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.03);
}
.xp-fill{
  height:100%;width:0%;background:linear-gradient(90deg,#008cff,#0af);transition:width 700ms ease;
  box-shadow:0 0 18px rgba(10,170,255,0.22);
}

/* Quest list */
.quest-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;}
.quest-card{
  background:linear-gradient(180deg,rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border-radius:14px;padding:14px;border:1px solid rgba(255,255,255,0.04);
  box-shadow:0 6px 20px rgba(0,0,0,0.5);
  transition:transform .18s ease, box-shadow .18s ease;
}
.quest-card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,170,255,0.06);}

/* badges */
.badge-daily{background:linear-gradient(90deg,#2a8bff,#4bd8ff);color:#001;box-shadow:0 6px 18px rgba(10,170,255,0.06);}
.badge-boss{background:linear-gradient(90deg,#ff4b4b,#ff8b4b);color:white;box-shadow:0 6px 18px rgba(255,80,80,0.06);}
.badge-easy{background:linear-gradient(90deg,#6bffb1,#00c78a);color:#003;}

/* progress small */
.small-progress{height:10px;border-radius:999px;background:var(--muted);overflow:hidden;margin:8px 0;}
.small-progress .fill{height:100%;background:linear-gradient(90deg,#008cff,#0af);width:0%;transition:width .5s ease;box-shadow:0 0 12px rgba(10,170,255,0.18)}

/* modal styling */
.modal-content { background: linear-gradient(180deg,#001224,#001430); border-radius:18px; border:1px solid rgba(10,140,255,0.12); color:#e8f8ff; }
.quest-modal-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.quest-icon{width:72px;height:72px;border-radius:12px;background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 0 20px rgba(10,170,255,0.06);}
.modal-actions{display:flex;gap:8px;}

/* buttons */
.btn-solo{
  background:linear-gradient(90deg,#008cff,#0af);border:none;color:#001;font-weight:700;border-radius:10px;
  box-shadow:0 6px 20px rgba(10,170,255,0.08);
}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#eaf6ff;border-radius:10px}
.btn-danger{background:linear-gradient(90deg,#ff5a5a,#ff915a);border:none;color:#111;font-weight:700;border-radius:10px;}

/* confetti & complete animation */
.complete-burst{
  position:fixed;left:50%;top:28%;transform:translateX(-50%);z-index:2000;pointer-events:none;
  animation:popfade 1.2s ease forwards;
}
@keyframes popfade {
  0%{transform:translate(-50%, -20%) scale(.8);opacity:0}
  25%{opacity:1;transform:translate(-50%,0) scale(1.05)}
  100%{opacity:0;transform:translate(-50%,-30%) scale(1)}
}

/* small utilities */
.meta{font-size:0.86rem;color:rgba(255,255,255,0.6)}
.row-between{display:flex;justify-content:space-between;align-items:center}

/* loading splash */
.splash{
  position:fixed;inset:0;background:linear-gradient(180deg,#001018,#000010);display:flex;align-items:center;justify-content:center;z-index:4000;
  color:var(--glow);font-size:18px;flex-direction:column;gap:12px;
}
.splash .loader{width:86px;height:86px;border-radius:18px;background:linear-gradient(135deg,#01173a,#00223d);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(0,170,255,0.08);border:1px solid rgba(10,140,255,0.12)}
.splash.hidden{display:none}

/* Responsive Mobile */
@media(max-width:720px){
  .quest-grid{grid-template-columns:1fr !important; gap:10px;}
  .xp-wrap{min-width:auto; flex:1;}
  .status{flex-direction:column; align-items:flex-start; gap:8px;}
  .level-badge{width:60px;height:60px;font-size:16px;}
  .xp-bar{width:100%;}
  .app-header .brand{flex-direction:column; align-items:flex-start; gap:6px;}
  .btn-solo, .btn-ghost, .btn-danger{font-size:0.85rem; padding:6px 10px;}
  .quest-card{padding:10px;}
  .quest-card .small-progress{margin-top:6px;}
}
</style>
</head>
<body>

<!-- LOADING SPLASH -->
<div id="splash" class="splash">
  <div class="loader">
    <div style="text-align:center">
      <div style="font-size:22px;font-weight:800">ARISE</div>
      <div style="font-size:11px;margin-top:6px;color:rgba(255,255,255,0.4)">Quest System</div>
    </div>
  </div>
  <div class="meta">Loading Quests...</div>
</div>

<div class="container" id="app" style="opacity:0;transition:opacity .4s ease">
  <div class="app-header">
    <div class="brand">
      <div class="logo">SL</div>
      <div>
        <div style="font-weight:800;font-size:18px">Strategy — Questboard</div>
        <div class="meta">Solo-Leveling style quests & progression</div>
      </div>
    </div>

    <div class="status">
      <div class="level-badge" id="levelBadge">
        <div style="font-size:20px" id="levelNum">1</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.6)">Level</div>
      </div>
      <div class="xp-wrap">
        <div class="row-between" style="margin-bottom:6px">
          <div class="meta">XP: <span id="xpText">0/100</span></div>
          <div class="meta">Coins: <strong id="coins">0</strong></div>
        </div>
        <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div style="display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-ghost" id="addDemoQuest">+ Add Demo Quest</button>
    <button class="btn btn-ghost" id="resetAll">Reset All</button>
    <div style="flex:1"></div>
    <div class="meta" id="lastSaved">Saved</div>
  </div>

  <!-- Quest Grid -->
  <div class="quest-grid" id="questGrid" style="margin-top:14px"></div>
</div>

<!-- Quest Modal -->
<div class="modal fade" id="questModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">
      <div class="quest-modal-header">
        <div class="quest-icon" id="modalIcon">💪</div>
        <div style="flex:1">
          <div id="modalTitle" style="font-size:20px;font-weight:800"></div>
          <div class="meta" id="modalType">Quest</div>
          <div class="meta" id="modalDesc" style="margin-top:8px"></div>
        </div>
        <div style="width:80px;text-align:right">
          <div class="meta">Reward</div>
          <div id="modalReward" style="font-weight:800;font-size:18px">+0 XP</div>
        </div>
      </div>

      <hr style="border-top:1px solid rgba(255,255,255,0.03)">

      <div>
        <div class="row-between">
          <div class="meta">Progress</div>
          <div class="meta"><span id="modalProgressText">0/100</span></div>
        </div>
        <div class="small-progress"><div class="fill" id="modalSmallFill"></div></div>

        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn-solo btn w-100" id="btnPlus10">+10</button>
          <button class="btn-solo btn w-100" id="btnPlus1">+1</button>
        </div>

        <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
          <input type="number" id="manualAdd" placeholder="+X" class="form-control" style="max-width:120px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);color:#eaf6ff" />
          <button class="btn btn-ghost" id="btnAddManual">Add</button>
          <div style="flex:1"></div>
          <button class="btn btn-danger" id="btnResetProgress">Reset</button>
        </div>

        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn btn-solo w-100" id="btnMarkComplete">Mark Complete</button>
          <button class="btn btn-ghost w-100" id="btnCloseModal" data-bs-dismiss="modal">Close</button>
        </div>

      </div>

    </div>
  </div>
</div>

<!-- Confetti container -->
<div id="confettiRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ---------------- JS from original version ----------------
let defaultQuests = [
  { id:'saitama', name:'Saitama Training', type:'daily', icon:'💪', desc:'100 Pushups / 100 Situps / 100 Squats / 10km Run', goal:100, xpPer:1, coinReward:25, difficulty:'hard' },
  { id:'push-boost', name:'Pushup Set', type:'quest', icon:'🟦', desc:'Do 50 pushups in sets.', goal:50, xpPer:2, coinReward:12, difficulty:'easy' },
  { id:'boss-goblin', name:'Goblin Slayer (Boss)', type:'boss', icon:'👹', desc:'Defeat the Goblin Boss: 1 epic battle', goal:1, xpPer:300, coinReward:200, difficulty:'boss' }
];
let state = { quests:[], progress:{}, level:1, xp:0, coins:0, lastSaved:null, streak:0 };
const KEY='arise_quest_v1';

function saveState(){ localStorage.setItem(KEY, JSON.stringify(state)); state.lastSaved = new Date().toLocaleString(); document.getElementById('lastSaved').innerText = 'Saved ' + state.lastSaved; }
function loadState(){ let raw=localStorage.getItem(KEY); if(raw){ try{ Object.assign(state, JSON.parse(raw)); }catch(e){} } else { state.quests=defaultQuests.slice(); defaultQuests.forEach(q=> state.progress[q.id]=0);} }
function xpToNext(level){ return Math.floor(100 * Math.pow(1.25, level-1)); }
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function playTone(freq,type='sine',dur=0.12,gain=0.12){try{let o=audioCtx.createOscillator();let g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}}
function playSound(name){ if(!audioCtx) return; if(name==='xp'){ playTone(880,'sine',0.08,0.06); playTone(1320,'sine',0.06,0.04); } if(name==='level'){ playTone(540,'sawtooth',0.18,0.14); playTone(720,'sine',0.18,0.12);} if(name==='complete'){playTone(1200,'triangle',0.12,0.12);playTone(1600,'sine',0.08,0.06);} if(name==='coin'){playTone(880,'square',0.06,0.06); playTone(1100,'sine',0.06,0.05);}}

function gainXP(amount){ playSound('xp'); state.xp+=amount; while(state.xp>=xpToNext(state.level)){ state.xp-=xpToNext(state.level); state.level+=1; playSound('level'); showLevelUp(state.level);} updateUI(); saveState();}
function earnCoins(n){ state.coins+=n; updateUI(); playSound('coin'); saveState();}

function showConfetti(){ const root=document.getElementById('confettiRoot'); const wrap=document.createElement('div'); wrap.className='complete-burst'; const emojis=['🎉','✨','🔥','💥','⭐','🪙']; for(let i=0;i<12;i++){ const el=document.createElement('div'); el.style.position='absolute'; el.style.left=(50+(Math.random()*180-90))+'%'; el.style.top=(28+(Math.random()*40-20))+'%'; el.style.transform='translateX(-50%) rotate('+(Math.random()*360)+'deg)'; el.style.fontSize=(12+Math.random()*22)+'px'; el.style.opacity=1; el.innerText=emojis[Math.floor(Math.random()*emojis.length)]; wrap.appendChild(el);} root.appendChild(wrap); setTimeout(()=>wrap.remove(),1500);}
function showLevelUp(lvl){ const badge=document.createElement('div'); badge.innerHTML=`<div style="background:linear-gradient(90deg,#00e2ff,#4bc8ff);color:#002;padding:14px 18px;border-radius:12px;font-weight:800;box-shadow:0 12px 30px rgba(10,170,255,0.14)">LEVEL UP<br><span style="font-size:18px">Level ${lvl}</span></div>`; badge.style.position='fixed'; badge.style.left='50%'; badge.style.top='18%'; badge.style.transform='translateX(-50%)'; badge.style.zIndex=3000; badge.style.opacity=0; badge.style.transition='opacity 0.2s ease, transform 0.3s ease'; document.body.appendChild(badge); setTimeout(()=>{ badge.style.opacity=1; badge.style.transform='translateX(-50%) translateY(-12px)'; },20); setTimeout(()=>{ badge.style.opacity=0; badge.style.transform='translateX(-50%) translateY(-28px)'; setTimeout(()=>badge.remove(),400); },1200);}

function updateUI(){ document.getElementById('levelNum').innerText=state.level; document.getElementById('xpText').innerText=state.xp+'/'+xpToNext(state.level); document.getElementById('xpFill').style.width=Math.min(100,state.xp/xpToNext(state.level)*100)+'%'; document.getElementById('coins').innerText=state.coins; renderQuests(); }

function renderQuests(){ const grid=document.getElementById('questGrid'); grid.innerHTML=''; state.quests.forEach(q=>{ const p=state.progress[q.id]||0; const card=document.createElement('div'); card.className='quest-card'; card.innerHTML=`<div style="font-size:24px">${q.icon} ${q.name}</div><div class="meta">${q.desc}</div><div class="small-progress"><div class="fill" style="width:${Math.min(100,p/q.goal*100)}%"></div></div>`; card.onclick=()=>openQuestModal(q.id); grid.appendChild(card); }); }

function openQuestModal(id){ const quest=state.quests.find(q=>q.id===id); if(!quest) return; const modal=new bootstrap.Modal(document.getElementById('questModal')); document.getElementById('modalTitle').innerText=quest.name; document.getElementById('modalType').innerText=quest.type; document.getElementById('modalDesc').innerText=quest.desc; document.getElementById('modalReward').innerText=`+${quest.xpPer} XP / ${quest.coinReward} Coins`; document.getElementById('modalProgressText').innerText=`${state.progress[id]||0}/${quest.goal}`; document.getElementById('modalSmallFill').style.width=`${Math.min(100,(state.progress[id]||0)/quest.goal*100)}%`; currentModalQuest=id; modal.show(); }

let currentModalQuest=null;
document.getElementById('btnPlus1').onclick=()=>{ addProgress(1); };
document.getElementById('btnPlus10').onclick=()=>{ addProgress(10); };
document.getElementById('btnAddManual').onclick=()=>{ const n=parseInt(document.getElementById('manualAdd').value); if(!isNaN(n)) addProgress(n); };
document.getElementById('btnResetProgress').onclick=()=>{ if(!currentModalQuest) return; state.progress[currentModalQuest]=0; updateModal(); saveState(); };
document.getElementById('btnMarkComplete').onclick=()=>{ if(!currentModalQuest) return; const q=state.quests.find(q=>q.id===currentModalQuest); state.progress[currentModalQuest]=q.goal; gainXP(q.xpPer*q.goal); earnCoins(q.coinReward); showConfetti(); updateModal(); saveState(); };
document.getElementById('btnCloseModal').onclick=()=>{ currentModalQuest=null; };

function addProgress(n){ if(!currentModalQuest) return; const q=state.quests.find(q=>q.id===currentModalQuest); state.progress[currentModalQuest]=(state.progress[currentModalQuest]||0)+n; if(state.progress[currentModalQuest]>q.goal) state.progress[currentModalQuest]=q.goal; gainXP(q.xpPer*n); updateModal(); saveState(); }

function updateModal(){ if(!currentModalQuest) return; const q=state.quests.find(q=>q.id===currentModalQuest); document.getElementById('modalProgressText').innerText=`${state.progress[currentModalQuest]||0}/${q.goal}`; document.getElementById('modalSmallFill').style.width=`${Math.min(100,(state.progress[currentModalQuest]||0)/q.goal*100)}%`; }

document.getElementById('addDemoQuest').onclick=()=>{ defaultQuests.forEach(q=>{ if(!state.quests.find(x=>x.id===q.id)) { state.quests.push(q); state.progress[q.id]=0; } }); updateUI(); saveState(); };
document.getElementById('resetAll').onclick=()=>{ state.quests=[]; state.progress={}; state.level=1; state.xp=0; state.coins=0; updateUI(); saveState(); };

// INIT
loadState();
updateUI();
setTimeout(()=>{ document.getElementById('splash').classList.add('hidden'); document.getElementById('app').style.opacity=1; },900);
</script>

</body>
</html>
